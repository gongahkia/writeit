name: Feature request
description: Propose a scoped product or engineering change.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow is blocked or inefficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Safety/privacy impact
      options:
        - none expected
        - permissions
        - local data
        - tool execution
        - network or external service
        - unknown
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How should this be tested?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
