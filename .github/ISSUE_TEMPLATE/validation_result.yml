name: Validation result
description: Share macOS, release, speech, model, safety, or MCP validation results.
title: "[validation]: "
labels: ["validation"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - macOS runtime
        - release packaging
        - speech
        - wake word
        - AirPods gestures
        - Foundation Models
        - tool safety
        - MCP
        - screen/OCR
        - adapter training
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS build, Xcode version, Mac model, AirPods model if relevant, commit hash.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands or checklist items run
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Summarize pass/fail and attach redacted artifacts only.
    validations:
      required: true
  - type: textarea
    id: gaps
    attributes:
      label: Gaps
      description: Hardware, permissions, credentials, or data not available.
