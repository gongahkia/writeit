name: Bug report
description: Report a reproducible cerberus bug.
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use exact commands, settings, and app actions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS build, Xcode version, Mac model, commit hash.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks run
      description: Include `swift test`, release checks, benchmarks, or manual validation.
  - type: textarea
    id: privacy
    attributes:
      label: Privacy notes
      description: Do not paste transcripts, tokens, recordings, screenshots, or private data.
    validations:
      required: true
