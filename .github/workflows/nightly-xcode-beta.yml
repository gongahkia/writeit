name: Nightly Xcode Beta

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    name: swift test latest Xcode
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        shell: zsh --login --errexit --pipefail {0}
        run: |
          mkdir -p .dist/ci
          if [[ -d /Applications/Xcode-beta.app ]]; then
            sudo xcode-select -s /Applications/Xcode-beta.app
          else
            latest_xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort -V | tail -n 1)"
            if [[ -n "$latest_xcode" ]]; then
              sudo xcode-select -s "$latest_xcode"
            fi
          fi
          xcode-select -p | tee .dist/ci/nightly-xcode-beta.log
          xcodebuild -version | tee -a .dist/ci/nightly-xcode-beta.log
          swift --version | tee -a .dist/ci/nightly-xcode-beta.log

      - name: Test
        shell: zsh --login --errexit --pipefail {0}
        run: |
          swift test 2>&1 | tee -a .dist/ci/nightly-xcode-beta.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nightly-xcode-beta-logs
          path: .dist/ci/nightly-xcode-beta.log
          if-no-files-found: error
