name: Swift Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    name: swift test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Test
        shell: zsh --login --errexit --pipefail {0}
        run: |
          mkdir -p .dist/ci
          swift test 2>&1 | tee .dist/ci/swift-test.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: swift-test-logs
          path: .dist/ci/*.log
          if-no-files-found: error
