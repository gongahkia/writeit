name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - run: bash -n script/build_and_run.sh script/package_release.sh
      - run: ./script/package_release.sh --dry-run
      - run: git diff --check
